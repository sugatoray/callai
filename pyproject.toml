[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "callai-cli"  # `callai` is taken on PyPI; the import package and command stay `callai`
version = "0.8.0"
description = "One CLI to run a prompt non-interactively through any coding-agent harness (claude-code, codex, opencode, pi, hermes, grok)."
requires-python = ">=3.11"
authors = [
    { name = "Sugato Ray", email = "sugatoray.dev@gmail.com" }
]
readme = {file = "README.md", content-type = "text/markdown"}
license = "Apache-2.0"
classifiers = [ 
    ##########################################################################################
    # source:
    # - adding classifiers to pyproject.toml:
    #   - https://packaging.python.org/en/latest/guides/writing-pyproject-toml/#classifiers
    # - List of classifiers: https://pypi.org/classifiers/
    # How mature is this project? Common values are:
    # - "3 - Alpha"
    # - "4 - Beta"
    # - "5 - Production/Stable"
    ##########################################################################################
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: AI Engineers",

    "Operating System :: OS Independent",
    #"Operating System :: POSIX :: Linux",
    #"Operating System :: MacOS :: MacOS X",
    #"Operating System :: Microsoft :: Windows",

    # the Python versions `make test.matrix` and CI test on
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",

    "Topic :: Software Development",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: CLI",
    "Topic :: Utilities",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Agentic Harness",
    "Typing :: Typed",
    
    ## If an internal or private package, add the following classifier:
    # "Private :: Do Not Upload",
]
dependencies = []  # stdlib-only by design (DESIGN.md §4)

[project.urls]
Homepage = "https://github.com/sugatoray/callai"
Issues = "https://github.com/sugatoray/callai/issues"
Documentation = "https://github.com/sugatoray/callai/blob/master/docs/callai/README.md"
Source = "https://github.com/sugatoray/callai"

[project.optional-dependencies]
test = ["pytest>=7.0", "pytest-cov>=4.0"]
dev = ["ruff>=0.6.0", "interrogate>=1.7.0"]

[project.scripts]
callai = "callai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["callai*"]  # exclude the top-level src/tests/ package from the built wheel
namespaces = false

[tool.pytest.ini_options]
testpaths = ["src/tests"]
pythonpath = ["src"]
addopts = "--cov=callai --cov-report=term-missing"
markers = ["live: calls a real harness and model; skipped unless CALLAI_LIVE is set (see src/tests/test_live.py)"]

[tool.coverage.run]
source = ["callai"]
branch = true
patch = ["subprocess"]  # measure the end-to-end `python -m callai` runs too
omit = [
    "*/tests/*",
    "*/__main__.py",  # 4-line trampoline; covered by an end-to-end subprocess test instead
]

[tool.coverage.report]
show_missing = true
fail_under = 95

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src"]
include = ["*.py", "*.pyi"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "D", "DOC"]
preview = true  # required for the DOC (pydoclint) rule set; scoped to lint only

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"src/tests/*" = ["D", "DOC"]

[tool.ruff.format]
quote-style = "double"

[tool.interrogate]
fail-under = 100
style = "google"
verbose = 1
exclude = ["src/tests", "build", "dist", ".venv"]

[tool.uv]
#########################################################################################
## notes:
## To ensure uv does not download or upgrade to libraries released in the last 7 days,
## use the "exclude-newer" setting. This acts as a "cooldown" period, preventing the
## installation of freshly released packages.
## source:
## - https://stackoverflow.com/a/79874496/8474894
## - https://simonwillison.net/2024/May/10/uv-pip-install-exclude-newer/
##
## Either set it globally for all uv commands or use it on a per-command basis.
## $ uv lock --exclude-newer "7 days"
## or
## $ uv pip install -r requirements.in --exclude-newer "7 days"
##
## Allow this specific package to be newer
# exclude-newer-package = { "some-package" = "0 days" }
#########################################################################################
exclude-newer = "5 days"

# [tool.uv.exclude-newer-package]
# "gitpython" = "2 days"
# "pydantic" = "2 days"
# "marimo" = "1 days"


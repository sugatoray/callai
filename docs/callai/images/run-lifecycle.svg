<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" fill="#111827" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" viewBox="0 0 900 520"><title>The life of one callai run, and where each exit code comes from</title><defs><marker id="a" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#374151" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect width="900" height="520" fill="#fff"/><rect width="899" height="519" x=".5" y=".5" fill="none" stroke="#d1d5db"/><text x="24" y="34" font-size="18" font-weight="700">The life of one run</text><text x="560" y="34" fill="#374151" font-size="13">stops here with exit code →</text><g><rect width="500" height="44" x="24" y="56" fill="#eef2ff" stroke="#4f46e5" rx="6"/><text x="40" y="83"><tspan font-weight="700">1. Resolve settings</tspan>: flag › CALLAI_* › config.toml › default</text><rect width="500" height="44" x="24" y="112" fill="#eef2ff" stroke="#4f46e5" rx="6"/><text x="40" y="139"><tspan font-weight="700">2. Check options</tspan> the harness can&apos;t honour (before stdin)</text><rect width="500" height="44" x="24" y="168" fill="#eef2ff" stroke="#4f46e5" rx="6"/><text x="40" y="195"><tspan font-weight="700">3. Read the prompt</tspan>: -p, plus piped stdin (3 s wait)</text><rect width="500" height="44" x="24" y="224" fill="#ecfdf5" stroke="#059669" rx="6"/><text x="40" y="251"><tspan font-weight="700">4. Build</tspan> the harness&apos;s argv and env</text><rect width="500" height="44" x="24" y="280" fill="#fff7ed" stroke="#ea580c" rx="6"/><text x="40" y="307"><tspan font-weight="700">5. Find</tspan> the harness binary on PATH</text><rect width="500" height="44" x="24" y="336" fill="#fff7ed" stroke="#ea580c" rx="6"/><text x="40" y="363"><tspan font-weight="700">6. Run</tspan> it (own process group, empty stdin)</text><rect width="500" height="44" x="24" y="392" fill="#ecfdf5" stroke="#059669" rx="6"/><text x="40" y="419"><tspan font-weight="700">7. Parse</tspan> its output into a Result</text><rect width="500" height="44" x="24" y="448" fill="#eff6ff" stroke="#2563eb" rx="6"/><text x="40" y="475"><tspan font-weight="700">8. Print</tspan> text / json / stream-json; exit</text></g><g stroke="#374151" stroke-width="1.5"><line x1="274" x2="274" y1="100" y2="110" marker-end="url(#a)"/><line x1="274" x2="274" y1="156" y2="166" marker-end="url(#a)"/><line x1="274" x2="274" y1="212" y2="222" marker-end="url(#a)"/><line x1="274" x2="274" y1="268" y2="278" marker-end="url(#a)"/><line x1="274" x2="274" y1="324" y2="334" marker-end="url(#a)"/><line x1="274" x2="274" y1="380" y2="390" marker-end="url(#a)"/><line x1="274" x2="274" y1="436" y2="446" marker-end="url(#a)"/></g><g font-size="13"><line x1="524" x2="560" y1="78" y2="78" stroke="#9ca3af" stroke-dasharray="4 3"/><text x="566" y="83"><tspan fill="#b91c1c" font-weight="700">2</tspan> no harness, bad config, unknown flag</text><line x1="524" x2="560" y1="134" y2="134" stroke="#9ca3af" stroke-dasharray="4 3"/><text x="566" y="139"><tspan fill="#b91c1c" font-weight="700">2</tspan> e.g. opencode + --permission read-only</text><line x1="524" x2="560" y1="190" y2="190" stroke="#9ca3af" stroke-dasharray="4 3"/><text x="566" y="195"><tspan fill="#b91c1c" font-weight="700">2</tspan> no prompt at all</text><line x1="524" x2="560" y1="246" y2="246" stroke="#9ca3af" stroke-dasharray="4 3"/><text x="566" y="251"><tspan fill="#047857" font-weight="700">0</tspan> --dry-run prints the command here</text><line x1="524" x2="560" y1="302" y2="302" stroke="#9ca3af" stroke-dasharray="4 3"/><text x="566" y="307"><tspan fill="#b91c1c" font-weight="700">127</tspan> harness not installed</text><line x1="524" x2="560" y1="358" y2="358" stroke="#9ca3af" stroke-dasharray="4 3"/><text x="566" y="363"><tspan fill="#b91c1c" font-weight="700">124</tspan> timeout · <tspan fill="#b91c1c" font-weight="700">130</tspan> Ctrl-C</text><line x1="524" x2="560" y1="470" y2="470" stroke="#9ca3af" stroke-dasharray="4 3"/><text x="566" y="468">the harness&apos;s own code,</text><text x="566" y="486">or <tspan fill="#b91c1c" font-weight="700">1</tspan> if it failed but exited 0</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#111827">
  <title>The life of one callai run, and where each exit code comes from</title>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
  <rect width="900" height="520" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="899" height="519" fill="none" stroke="#d1d5db"/>
  <text x="24" y="34" font-size="18" font-weight="700">The life of one run</text>
  <text x="560" y="34" font-size="13" fill="#374151">stops here with exit code →</text>
  <g>
    <rect x="24" y="56" width="500" height="44" rx="6" fill="#eef2ff" stroke="#4f46e5"/>
    <text x="40" y="83"><tspan font-weight="700">1. Resolve settings</tspan>: flag › CALLAI_* › config.toml › default</text>
    <rect x="24" y="112" width="500" height="44" rx="6" fill="#eef2ff" stroke="#4f46e5"/>
    <text x="40" y="139"><tspan font-weight="700">2. Check options</tspan> the harness can't honour (before stdin)</text>
    <rect x="24" y="168" width="500" height="44" rx="6" fill="#eef2ff" stroke="#4f46e5"/>
    <text x="40" y="195"><tspan font-weight="700">3. Read the prompt</tspan>: -p, plus piped stdin (3 s wait)</text>
    <rect x="24" y="224" width="500" height="44" rx="6" fill="#ecfdf5" stroke="#059669"/>
    <text x="40" y="251"><tspan font-weight="700">4. Build</tspan> the harness's argv and env</text>
    <rect x="24" y="280" width="500" height="44" rx="6" fill="#fff7ed" stroke="#ea580c"/>
    <text x="40" y="307"><tspan font-weight="700">5. Find</tspan> the harness binary on PATH</text>
    <rect x="24" y="336" width="500" height="44" rx="6" fill="#fff7ed" stroke="#ea580c"/>
    <text x="40" y="363"><tspan font-weight="700">6. Run</tspan> it (own process group, empty stdin)</text>
    <rect x="24" y="392" width="500" height="44" rx="6" fill="#ecfdf5" stroke="#059669"/>
    <text x="40" y="419"><tspan font-weight="700">7. Parse</tspan> its output into a Result</text>
    <rect x="24" y="448" width="500" height="44" rx="6" fill="#eff6ff" stroke="#2563eb"/>
    <text x="40" y="475"><tspan font-weight="700">8. Print</tspan> text / json / stream-json; exit</text>
  </g>
  <g stroke="#374151" stroke-width="1.5">
    <line x1="274" y1="100" x2="274" y2="110" marker-end="url(#a)"/>
    <line x1="274" y1="156" x2="274" y2="166" marker-end="url(#a)"/>
    <line x1="274" y1="212" x2="274" y2="222" marker-end="url(#a)"/>
    <line x1="274" y1="268" x2="274" y2="278" marker-end="url(#a)"/>
    <line x1="274" y1="324" x2="274" y2="334" marker-end="url(#a)"/>
    <line x1="274" y1="380" x2="274" y2="390" marker-end="url(#a)"/>
    <line x1="274" y1="436" x2="274" y2="446" marker-end="url(#a)"/>
  </g>
  <g font-size="13">
    <line x1="524" y1="78" x2="560" y2="78" stroke="#9ca3af" stroke-dasharray="4 3"/>
    <text x="566" y="83"><tspan font-weight="700" fill="#b91c1c">2</tspan>  no harness, bad config, unknown flag</text>
    <line x1="524" y1="134" x2="560" y2="134" stroke="#9ca3af" stroke-dasharray="4 3"/>
    <text x="566" y="139"><tspan font-weight="700" fill="#b91c1c">2</tspan>  e.g. opencode + --permission read-only</text>
    <line x1="524" y1="190" x2="560" y2="190" stroke="#9ca3af" stroke-dasharray="4 3"/>
    <text x="566" y="195"><tspan font-weight="700" fill="#b91c1c">2</tspan>  no prompt at all</text>
    <line x1="524" y1="246" x2="560" y2="246" stroke="#9ca3af" stroke-dasharray="4 3"/>
    <text x="566" y="251"><tspan font-weight="700" fill="#047857">0</tspan>  --dry-run prints the command here</text>
    <line x1="524" y1="302" x2="560" y2="302" stroke="#9ca3af" stroke-dasharray="4 3"/>
    <text x="566" y="307"><tspan font-weight="700" fill="#b91c1c">127</tspan>  harness not installed</text>
    <line x1="524" y1="358" x2="560" y2="358" stroke="#9ca3af" stroke-dasharray="4 3"/>
    <text x="566" y="363"><tspan font-weight="700" fill="#b91c1c">124</tspan> timeout · <tspan font-weight="700" fill="#b91c1c">130</tspan> Ctrl-C</text>
    <line x1="524" y1="470" x2="560" y2="470" stroke="#9ca3af" stroke-dasharray="4 3"/>
    <text x="566" y="468">the harness's own code,</text>
    <text x="566" y="486">or <tspan font-weight="700" fill="#b91c1c">1</tspan> if it failed but exited 0</text>
  </g>
</svg>

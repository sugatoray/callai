<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" fill="#111827" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" viewBox="0 0 900 360"><title>Where each setting comes from: the first source that sets it wins</title><defs><marker id="a" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#374151" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect width="900" height="360" fill="#fff"/><rect width="899" height="359" x=".5" y=".5" fill="none" stroke="#d1d5db"/><text x="24" y="34" font-size="18" font-weight="700">Where a setting comes from (first match wins)</text><g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13"><rect width="560" height="42" x="24" y="56" fill="#eef2ff" stroke="#4f46e5" rx="6"/><text x="40" y="82"><tspan font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="700">1 Command-line flag</tspan> -m opus</text><rect width="560" height="42" x="24" y="108" fill="#eef2ff" stroke="#4f46e5" rx="6"/><text x="40" y="134"><tspan font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="700">2 Environment</tspan> CALLAI_MODEL=opus</text><rect width="560" height="42" x="24" y="160" fill="#ecfdf5" stroke="#059669" rx="6"/><text x="40" y="186"><tspan font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="700">3 Config, per harness</tspan> [harnesses.codex] model = &quot;o3&quot;</text><rect width="560" height="42" x="24" y="212" fill="#ecfdf5" stroke="#059669" rx="6"/><text x="40" y="238"><tspan font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="700">4 Config, top level</tspan> model = &quot;fast&quot;</text><rect width="560" height="42" x="24" y="264" fill="#f9fafb" stroke="#6b7280" rx="6"/><text x="40" y="290"><tspan font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="700">5 Built-in default</tspan> the harness&apos;s own model</text></g><line x1="600" x2="640" y1="150" y2="150" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/><rect width="230" height="110" x="646" y="102" fill="#fff7ed" stroke="#ea580c" rx="8"/><text x="761" y="128" font-weight="700" text-anchor="middle">Then: model aliases</text><text x="662" y="154" font-size="13">If the value is an [aliases]</text><text x="662" y="174" font-size="13">name, use this harness&apos;s entry.</text><text x="662" y="194" font-size="13">No entry for it → error (exit 2).</text><text x="24" y="336" fill="#374151" font-size="12">Same order for the harness (-n · CALLAI_HARNESS_NAME · default_harness) and the timeout (--timeout · CALLAI_TIMEOUT · timeout).</text></svg>
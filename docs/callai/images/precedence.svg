<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#111827">
  <title>Where each setting comes from: the first source that sets it wins</title>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs>
  <rect width="900" height="360" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="899" height="359" fill="none" stroke="#d1d5db"/>
  <text x="24" y="34" font-size="18" font-weight="700">Where a setting comes from (first match wins)</text>
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13">
    <rect x="24" y="56" width="560" height="42" rx="6" fill="#eef2ff" stroke="#4f46e5"/>
    <text x="40" y="82"><tspan font-weight="700" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">1  Command-line flag</tspan>     -m opus</text>
    <rect x="24" y="108" width="560" height="42" rx="6" fill="#eef2ff" stroke="#4f46e5"/>
    <text x="40" y="134"><tspan font-weight="700" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">2  Environment</tspan>          CALLAI_MODEL=opus</text>
    <rect x="24" y="160" width="560" height="42" rx="6" fill="#ecfdf5" stroke="#059669"/>
    <text x="40" y="186"><tspan font-weight="700" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">3  Config, per harness</tspan>   [harnesses.codex] model = "o3"</text>
    <rect x="24" y="212" width="560" height="42" rx="6" fill="#ecfdf5" stroke="#059669"/>
    <text x="40" y="238"><tspan font-weight="700" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">4  Config, top level</tspan>     model = "fast"</text>
    <rect x="24" y="264" width="560" height="42" rx="6" fill="#f9fafb" stroke="#6b7280"/>
    <text x="40" y="290"><tspan font-weight="700" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">5  Built-in default</tspan>       the harness's own model</text>
  </g>
  <line x1="600" y1="150" x2="640" y2="150" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="646" y="102" width="230" height="110" rx="8" fill="#fff7ed" stroke="#ea580c"/>
  <text x="761" y="128" text-anchor="middle" font-weight="700">Then: model aliases</text>
  <text x="662" y="154" font-size="13">If the value is an [aliases]</text>
  <text x="662" y="174" font-size="13">name, use this harness's entry.</text>
  <text x="662" y="194" font-size="13">No entry for it → error (exit 2).</text>
  <text x="24" y="336" font-size="12" fill="#374151">Same order for the harness (-n · CALLAI_HARNESS_NAME · default_harness) and the timeout (--timeout · CALLAI_TIMEOUT · timeout).</text>
</svg>

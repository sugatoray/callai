<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" fill="#111827" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" viewBox="0 0 900 380"><title>-o stream-json: each harness&apos;s own events become the same five callai events</title><defs><marker id="a" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#374151" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect width="900" height="380" fill="#fff"/><rect width="899" height="379" x=".5" y=".5" fill="none" stroke="#d1d5db"/><text x="24" y="34" font-size="18" font-weight="700">-o stream-json: one event per line, as it happens</text><line x1="40" x2="860" y1="120" y2="120" stroke="#9ca3af" stroke-width="2" marker-end="url(#a)"/><text x="860" y="146" fill="#6b7280" font-size="12" text-anchor="end">time →</text><g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" text-anchor="middle"><rect width="120" height="34" x="40" y="70" fill="#e5e7eb" stroke="#6b7280" rx="17"/><text x="100" y="92">start</text><rect width="140" height="34" x="210" y="70" fill="#fed7aa" stroke="#ea580c" rx="17"/><text x="280" y="92">tool_use</text><rect width="150" height="34" x="390" y="70" fill="#fde68a" stroke="#d97706" rx="17"/><text x="465" y="92">tool_result</text><rect width="110" height="34" x="580" y="70" fill="#c7d2fe" stroke="#4f46e5" rx="17"/><text x="635" y="92">text</text><rect width="120" height="34" x="730" y="70" fill="#bbf7d0" stroke="#059669" rx="17"/><text x="790" y="92">result</text></g><g fill="#374151" font-size="12"><text x="40" y="168">callai writes it once</text><text x="40" y="184">the binary is found</text><text x="210" y="168">the model asked</text><text x="210" y="184">for a tool</text><text x="390" y="168">what the tool returned</text><text x="390" y="184">(is_error if it failed</text><text x="390" y="200">or was refused)</text><text x="580" y="168">assistant text</text><text x="580" y="184">(whole or a piece)</text><text x="730" y="168">the -o json object;</text><text x="730" y="184">always last</text></g><text x="24" y="240" font-weight="700">Mapped from each harness&apos;s own stream</text><g font-size="12"><text x="24" y="266"><tspan font-weight="700">claude</tspan> --output-format stream-json --verbose: assistant / user messages → text, tool_use, tool_result</text><text x="24" y="286"><tspan font-weight="700">codex</tspan> exec --json: item.started / item.completed → tool_use, tool_result; agent_message → text</text><text x="24" y="306"><tspan font-weight="700">opencode</tspan> run --format json: text parts; tool_use parts carry input and output together</text><text x="24" y="326"><tspan font-weight="700">pi</tspan> --mode json: text_delta pieces; tool_execution_start / _end</text><text x="24" y="346"><tspan font-weight="700">grok</tspan> --output-format streaming-json: text pieces; tool_call / tool_call_update</text><text x="24" y="366"><tspan font-weight="700">hermes</tspan> no event stream: start and result only</text></g></svg>
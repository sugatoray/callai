<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" fill="#111827" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" viewBox="0 0 900 400"><title>Fan-out: &apos;/&apos; runs harnesses at the same time, &apos;,&apos; runs them one after another</title><rect width="900" height="400" fill="#fff"/><rect width="899" height="399" x=".5" y=".5" fill="none" stroke="#d1d5db"/><text x="24" y="34" font-size="18" font-weight="700">Fan-out: one prompt, several harnesses</text><text x="24" y="70" font-family="ui-monospace, Menlo, Consolas, monospace" font-weight="700">-n codex/pi/grok</text><text x="210" y="70" fill="#374151" font-size="13">at the same time (also -n all: every installed harness)</text><g font-size="12"><text x="24" y="98">codex</text><rect width="300" height="18" x="110" y="86" fill="#c7d2fe" rx="4"/><text x="24" y="124">pi</text><rect width="200" height="18" x="110" y="112" fill="#bbf7d0" rx="4"/><text x="24" y="150">grok</text><rect width="250" height="18" x="110" y="138" fill="#fed7aa" rx="4"/></g><line x1="410" x2="410" y1="80" y2="162" stroke="#111827" stroke-dasharray="4 3"/><text x="418" y="150" fill="#374151" font-size="12">done when the slowest is done</text><text x="24" y="200" font-family="ui-monospace, Menlo, Consolas, monospace" font-weight="700">-n codex,pi,grok</text><text x="210" y="200" fill="#374151" font-size="13">one after another</text><g font-size="12"><text x="24" y="228">codex</text><rect width="300" height="18" x="110" y="216" fill="#c7d2fe" rx="4"/><text x="24" y="254">pi</text><rect width="200" height="18" x="410" y="242" fill="#bbf7d0" rx="4"/><text x="24" y="280">grok</text><rect width="250" height="18" x="610" y="268" fill="#fed7aa" rx="4"/></g><line x1="110" x2="866" y1="300" y2="300" stroke="#9ca3af"/><text x="866" y="318" fill="#6b7280" font-size="12" text-anchor="end">time →</text><rect width="852" height="54" x="24" y="330" fill="#eff6ff" stroke="#2563eb" rx="8"/><text x="40" y="353" font-size="13">Either way, results print <tspan font-weight="700">in the order given</tspan> (text: a <tspan font-family="ui-monospace, Menlo, Consolas, monospace">== name ==</tspan> header each; json: <tspan font-family="ui-monospace, Menlo, Consolas, monospace">{&quot;results&quot;: [...]}</tspan>).</text><text x="40" y="373" font-size="13">One failure doesn&apos;t stop the others. Exit code: 0 if all succeeded, else the first failure&apos;s, in the order given.</text></svg>
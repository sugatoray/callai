<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#111827">
  <title>Fan-out: '/' runs harnesses at the same time, ',' runs them one after another</title>
  <rect width="900" height="400" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="899" height="399" fill="none" stroke="#d1d5db"/>
  <text x="24" y="34" font-size="18" font-weight="700">Fan-out: one prompt, several harnesses</text>

  <text x="24" y="70" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">-n codex/pi/grok</text>
  <text x="210" y="70" font-size="13" fill="#374151">at the same time (also -n all: every installed harness)</text>
  <g font-size="12">
    <text x="24" y="98">codex</text><rect x="110" y="86" width="300" height="18" rx="4" fill="#c7d2fe"/>
    <text x="24" y="124">pi</text><rect x="110" y="112" width="200" height="18" rx="4" fill="#bbf7d0"/>
    <text x="24" y="150">grok</text><rect x="110" y="138" width="250" height="18" rx="4" fill="#fed7aa"/>
  </g>
  <line x1="410" y1="80" x2="410" y2="162" stroke="#111827" stroke-dasharray="4 3"/>
  <text x="418" y="150" font-size="12" fill="#374151">done when the slowest is done</text>

  <text x="24" y="200" font-weight="700" font-family="ui-monospace, Menlo, Consolas, monospace">-n codex,pi,grok</text>
  <text x="210" y="200" font-size="13" fill="#374151">one after another</text>
  <g font-size="12">
    <text x="24" y="228">codex</text><rect x="110" y="216" width="300" height="18" rx="4" fill="#c7d2fe"/>
    <text x="24" y="254">pi</text><rect x="410" y="242" width="200" height="18" rx="4" fill="#bbf7d0"/>
    <text x="24" y="280">grok</text><rect x="610" y="268" width="250" height="18" rx="4" fill="#fed7aa"/>
  </g>
  <line x1="110" y1="300" x2="866" y2="300" stroke="#9ca3af"/>
  <text x="866" y="318" text-anchor="end" font-size="12" fill="#6b7280">time →</text>

  <rect x="24" y="330" width="852" height="54" rx="8" fill="#eff6ff" stroke="#2563eb"/>
  <text x="40" y="353" font-size="13">Either way, results print <tspan font-weight="700">in the order given</tspan> (text: a <tspan font-family="ui-monospace, Menlo, Consolas, monospace">== name ==</tspan> header each; json: <tspan font-family="ui-monospace, Menlo, Consolas, monospace">{"results": [...]}</tspan>).</text>
  <text x="40" y="373" font-size="13">One failure doesn't stop the others. Exit code: 0 if all succeeded, else the first failure's, in the order given.</text>
</svg>

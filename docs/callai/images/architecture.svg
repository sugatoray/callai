<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" fill="#111827" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" viewBox="0 0 960 430"><title>callai architecture: the CLI and the Python API share one run path</title><defs><marker id="a" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#374151" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect width="960" height="430" fill="#fff"/><rect width="959" height="429" x=".5" y=".5" fill="none" stroke="#d1d5db"/><text x="24" y="34" font-size="18" font-weight="700">How a call flows through callai</text><rect width="190" height="64" x="24" y="64" fill="#eef2ff" stroke="#4f46e5" rx="8"/><text x="119" y="91" font-weight="700" text-anchor="middle">callai CLI</text><text x="119" y="112" fill="#374151" font-size="12" text-anchor="middle">flags · CALLAI_* · config.toml</text><rect width="190" height="64" x="24" y="148" fill="#eef2ff" stroke="#4f46e5" rx="8"/><text x="119" y="175" font-weight="700" text-anchor="middle">Python API</text><text x="119" y="196" fill="#374151" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" text-anchor="middle">callai.run(...)</text><rect width="150" height="64" x="264" y="104" fill="#f9fafb" stroke="#6b7280" rx="8"/><text x="339" y="131" font-weight="700" text-anchor="middle">Request</text><text x="339" y="152" fill="#374151" font-size="12" text-anchor="middle">one per harness</text><line x1="214" x2="262" y1="96" y2="126" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/><line x1="214" x2="262" y1="180" y2="150" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/><rect width="220" height="144" x="464" y="64" fill="#ecfdf5" stroke="#059669" rx="8"/><text x="574" y="88" font-weight="700" text-anchor="middle">Adapter (one per harness)</text><text x="482" y="116" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13">build_argv(req)</text><text x="482" y="140" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13">build_env(req)</text><text x="482" y="170" fill="#374151" font-size="12">pure: no I/O, so --dry-run</text><text x="482" y="188" fill="#374151" font-size="12">can print the command</text><line x1="414" x2="462" y1="136" y2="136" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/><rect width="202" height="144" x="734" y="64" fill="#fff7ed" stroke="#ea580c" rx="8"/><text x="835" y="88" font-weight="700" text-anchor="middle">runner.run</text><text x="750" y="114" fill="#374151" font-size="12">finds the binary on PATH</text><text x="750" y="134" fill="#374151" font-size="12">own process group, empty stdin</text><text x="750" y="154" fill="#374151" font-size="12">timeout → kill group (124)</text><text x="750" y="174" fill="#374151" font-size="12">Ctrl-C → SIGINT group (130)</text><text x="750" y="194" fill="#374151" font-size="12">stdout lines, as they arrive</text><line x1="684" x2="732" y1="136" y2="136" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/><rect width="202" height="76" x="734" y="248" fill="#f9fafb" stroke="#6b7280" stroke-dasharray="5 4" rx="8"/><text x="835" y="274" font-weight="700" text-anchor="middle">harness CLI</text><text x="835" y="296" fill="#374151" font-size="12" text-anchor="middle">claude · codex · opencode</text><text x="835" y="313" fill="#374151" font-size="12" text-anchor="middle">pi · hermes · grok</text><line x1="815" x2="815" y1="208" y2="246" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/><line x1="855" x2="855" y1="246" y2="210" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/><text x="862" y="232" fill="#6b7280" font-size="11">stdout</text><text x="742" y="232" fill="#6b7280" font-size="11">argv + env</text><rect width="220" height="104" x="464" y="248" fill="#ecfdf5" stroke="#059669" rx="8"/><text x="574" y="272" font-weight="700" text-anchor="middle">Adapter (same one)</text><text x="482" y="300" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13">stream_events(line)</text><text x="482" y="324" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13">parse(completed)</text><line x1="732" x2="686" y1="300" y2="300" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/><rect width="390" height="104" x="24" y="248" fill="#eff6ff" stroke="#2563eb" rx="8"/><text x="219" y="272" font-weight="700" text-anchor="middle">One shape for every harness</text><text x="40" y="300" font-size="13"><tspan font-weight="700">Result</tspan>: text, is_error, session_id, usage, …</text><text x="40" y="324" font-size="13"><tspan font-weight="700">Events</tspan>: start · text · tool_use · tool_result · result</text><text x="40" y="344" fill="#374151" font-size="12">printed as -o text / json / stream-json, or returned</text><line x1="462" x2="416" y1="300" y2="300" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/><text x="24" y="392" fill="#374151" font-size="12">-o raw skips parsing and prints the harness&apos;s own stdout. Fan-out (-n a/b/c) runs one Request per harness through this same path,</text><text x="24" y="410" fill="#374151" font-size="12">in parallel threads or one after another.</text></svg>
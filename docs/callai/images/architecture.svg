<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#111827">
  <title>callai architecture: the CLI and the Python API share one run path</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker>
  </defs>
  <rect width="960" height="430" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="959" height="429" fill="none" stroke="#d1d5db"/>
  <text x="24" y="34" font-size="18" font-weight="700">How a call flows through callai</text>

  <!-- entry points -->
  <rect x="24" y="64" width="190" height="64" rx="8" fill="#eef2ff" stroke="#4f46e5"/>
  <text x="119" y="91" text-anchor="middle" font-weight="700">callai CLI</text>
  <text x="119" y="112" text-anchor="middle" font-size="12" fill="#374151">flags · CALLAI_* · config.toml</text>
  <rect x="24" y="148" width="190" height="64" rx="8" fill="#eef2ff" stroke="#4f46e5"/>
  <text x="119" y="175" text-anchor="middle" font-weight="700">Python API</text>
  <text x="119" y="196" text-anchor="middle" font-size="12" fill="#374151" font-family="ui-monospace, Menlo, Consolas, monospace">callai.run(...)</text>

  <!-- request -->
  <rect x="264" y="104" width="150" height="64" rx="8" fill="#f9fafb" stroke="#6b7280"/>
  <text x="339" y="131" text-anchor="middle" font-weight="700">Request</text>
  <text x="339" y="152" text-anchor="middle" font-size="12" fill="#374151">one per harness</text>
  <line x1="214" y1="96" x2="262" y2="126" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="214" y1="180" x2="262" y2="150" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- adapter build -->
  <rect x="464" y="64" width="220" height="144" rx="8" fill="#ecfdf5" stroke="#059669"/>
  <text x="574" y="88" text-anchor="middle" font-weight="700">Adapter (one per harness)</text>
  <text x="482" y="116" font-size="13" font-family="ui-monospace, Menlo, Consolas, monospace">build_argv(req)</text>
  <text x="482" y="140" font-size="13" font-family="ui-monospace, Menlo, Consolas, monospace">build_env(req)</text>
  <text x="482" y="170" font-size="12" fill="#374151">pure: no I/O, so --dry-run</text>
  <text x="482" y="188" font-size="12" fill="#374151">can print the command</text>
  <line x1="414" y1="136" x2="462" y2="136" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- runner -->
  <rect x="734" y="64" width="202" height="144" rx="8" fill="#fff7ed" stroke="#ea580c"/>
  <text x="835" y="88" text-anchor="middle" font-weight="700">runner.run</text>
  <text x="750" y="114" font-size="12" fill="#374151">finds the binary on PATH</text>
  <text x="750" y="134" font-size="12" fill="#374151">own process group, empty stdin</text>
  <text x="750" y="154" font-size="12" fill="#374151">timeout → kill group (124)</text>
  <text x="750" y="174" font-size="12" fill="#374151">Ctrl-C → SIGINT group (130)</text>
  <text x="750" y="194" font-size="12" fill="#374151">stdout lines, as they arrive</text>
  <line x1="684" y1="136" x2="732" y2="136" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- harness -->
  <rect x="734" y="248" width="202" height="76" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-dasharray="5 4"/>
  <text x="835" y="274" text-anchor="middle" font-weight="700">harness CLI</text>
  <text x="835" y="296" text-anchor="middle" font-size="12" fill="#374151">claude · codex · opencode</text>
  <text x="835" y="313" text-anchor="middle" font-size="12" fill="#374151">pi · hermes · grok</text>
  <line x1="815" y1="208" x2="815" y2="246" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="855" y1="246" x2="855" y2="210" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="862" y="232" font-size="11" fill="#6b7280">stdout</text>
  <text x="742" y="232" font-size="11" fill="#6b7280">argv + env</text>

  <!-- parse -->
  <rect x="464" y="248" width="220" height="104" rx="8" fill="#ecfdf5" stroke="#059669"/>
  <text x="574" y="272" text-anchor="middle" font-weight="700">Adapter (same one)</text>
  <text x="482" y="300" font-size="13" font-family="ui-monospace, Menlo, Consolas, monospace">stream_events(line)</text>
  <text x="482" y="324" font-size="13" font-family="ui-monospace, Menlo, Consolas, monospace">parse(completed)</text>
  <line x1="732" y1="300" x2="686" y2="300" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- outputs -->
  <rect x="24" y="248" width="390" height="104" rx="8" fill="#eff6ff" stroke="#2563eb"/>
  <text x="219" y="272" text-anchor="middle" font-weight="700">One shape for every harness</text>
  <text x="40" y="300" font-size="13"><tspan font-weight="700">Result</tspan>: text, is_error, session_id, usage, …</text>
  <text x="40" y="324" font-size="13"><tspan font-weight="700">Events</tspan>: start · text · tool_use · tool_result · result</text>
  <text x="40" y="344" font-size="12" fill="#374151">printed as -o text / json / stream-json, or returned</text>
  <line x1="462" y1="300" x2="416" y2="300" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>

  <text x="24" y="392" font-size="12" fill="#374151">-o raw skips parsing and prints the harness's own stdout. Fan-out (-n a/b/c) runs one Request per harness through this same path,</text>
  <text x="24" y="410" font-size="12" fill="#374151">in parallel threads or one after another.</text>
</svg>

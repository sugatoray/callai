# Opt-in CI for pull requests. The `tests` workflow no longer runs on every PR commit; add the
# `ci::run-tests` label to a PR to run it, and it re-runs on each new push for as long as the label stays.
# Remove the label to stop. (A manual run of `tests` on any branch is still available.)
name: run-tests-on-label

on:
  pull_request:
    types: [labeled, synchronize, reopened, ready_for_review]

permissions:
  contents: read

# Distinct from the group inside tests.yml, which the called workflow evaluates on its own.
concurrency:
  group: label-trigger-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  tests:
    # `labeled` fires for every label; the check below also covers synchronize/reopened.
    if: contains(github.event.pull_request.labels.*.name, 'ci::run-tests')
    uses: ./.github/workflows/tests.yml
